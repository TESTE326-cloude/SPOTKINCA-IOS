name: Build iOS Artifacts

on:
  workflow_dispatch:
  push:
    branches: [ "feature/ios-support" ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build iOS Frameworks (Simulator & Device)
        run: ./gradlew :composeApp:linkDebugFrameworkIosArm64 :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Archive Frameworks
        uses: actions/upload-artifact@v4
        with:
          name: SpotKinca-iOS-Frameworks
          path: |
            composeApp/build/bin/iosArm64/debugFramework/*.framework
            composeApp/build/bin/iosSimulatorArm64/debugFramework/*.framework
