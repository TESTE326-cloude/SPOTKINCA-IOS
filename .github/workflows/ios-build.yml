name: Build iOS Artifacts & Frameworks

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ios-support
      - main
      - dev
  pull_request:
    branches:
      - feature/ios-support
      - main
      - dev

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build iOS Framework (Device - iosArm64)
        run: ./gradlew :composeApp:linkDebugFrameworkIosArm64 --stacktrace

      - name: Build iOS Framework (Simulator - iosSimulatorArm64)
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Upload framework artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpotKinca-iOS-Frameworks
          path: |
            composeApp/build/bin/iosArm64/debugFramework/*.framework
            composeApp/build/bin/iosSimulatorArm64/debugFramework/*.framework
          if-no-files-found: error
          retention-days: 7
