name: Build iOS Full App .app / .ipa

on:
  workflow_dispatch:
  push:
    branches: [ "feature/ios-support", "main", "dev", "master" ]
  pull_request:
    branches: [ "feature/ios-support", "main", "dev", "master" ]

jobs:
  build-ios-app:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build iOS Framework (Device - iosArm64)
        run: ./gradlew :composeApp:linkDebugFrameworkIosArm64 --stacktrace

      - name: Build iOS Framework (Simulator - iosSimulatorArm64)
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Build Xcode App (Simulator)
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,name=iPhone 16" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build

      - name: Upload iOS Simulator App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotKinca-iOS-SimulatorApp
          path: iosApp/build/Debug-iphonesimulator/iosApp.app
          if-no-files-found: warn

      - name: Upload Frameworks Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpotKinca-iOS-Frameworks
          path: |
            composeApp/build/bin/iosArm64/debugFramework/*.framework
            composeApp/build/bin/iosSimulatorArm64/debugFramework/*.framework
          if-no-files-found: warn
