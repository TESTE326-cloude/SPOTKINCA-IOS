
name: Build iOS Full App

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ios-support
      - main
      - dev
      - master
  pull_request:
    branches:
      - feature/ios-support
      - main
      - dev
      - master

jobs:
  build-ios-app:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build iOS Framework - Device
        run: ./gradlew :composeApp:linkDebugFrameworkIosArm64 --stacktrace

      - name: Build iOS Framework - Simulator
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Build iOS App - Physical Device
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath iosApp/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Device App
        run: |
          APP="iosApp/build/DerivedData/Build/Products/Debug-iphoneos/iosApp.app"
          test -d "$APP" || {
            echo "ERROR: Device app was not generated"
            exit 1
          }
          test -f "$APP/Info.plist" || {
            echo "ERROR: Info.plist missing"
            exit 1
          }
          test -f "$APP/iosApp" || {
            echo "ERROR: Main executable missing"
            exit 1
          }
          echo "Device app generated successfully"

      - name: Package Unsigned IPA
        run: |
          APP="iosApp/build/DerivedData/Build/Products/Debug-iphoneos/iosApp.app"
          TEMP_DIR="$RUNNER_TEMP/spotkinca-ipa"

          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR/Payload"

          ditto "$APP" "$TEMP_DIR/Payload/iosApp.app"

          cd "$TEMP_DIR"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/SpotKinca-iOS-Unsigned.ipa" Payload

          test -s "$GITHUB_WORKSPACE/SpotKinca-iOS-Unsigned.ipa"
          echo "Unsigned IPA generated successfully"

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SpotKinca-iOS-Unsigned-IPA
          path: SpotKinca-iOS-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload iOS Device App
        uses: actions/upload-artifact@v4
        with:
          name: SpotKinca-iOS-Device-App-Unsigned
          path: iosApp/build/DerivedData/Build/Products/Debug-iphoneos/iosApp.app
          if-no-files-found: error
          retention-days: 7

      - name: Build iOS App - Simulator
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath iosApp/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: SpotKinca-iOS-SimulatorApp
          path: iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator/iosApp.app
          if-no-files-found: error
          retention-days: 7

      - name: Upload Frameworks
        uses: actions/upload-artifact@v4
        with:
          name: SpotKinca-iOS-Frameworks
          path: |
            composeApp/build/bin/iosArm64/debugFramework/*.framework
            composeApp/build/bin/iosSimulatorArm64/debugFramework/*.framework
          if-no-files-found: error
          retention-days: 7
